openapi: 3.1.0
info:
  title: Nine Fives Programmable Attenuator REST API
  version: '1.0'
  description: >-
    JSON REST API served on port 80 by the Nine Fives POE-ATTEN-6G programmable
    RF attenuator for programmatic control and monitoring. Faithfully transcribed
    from the published device reference manual; the device also exposes SCPI over
    raw TCP (port 5025) and HiSLIP (port 4880). No authentication is required — the
    API is served directly by the device over the local network (Ethernet or USB-C).
  contact:
    name: Nine Fives
    url: https://ninefives.com
  x-generated: '2026-07-20'
  x-method: generated
  x-source: https://docs.ninefives.com/attenuator/rest-api/overview/
servers:
  - url: http://{deviceIp}
    description: Device-hosted API on port 80 (default Ethernet fallback IP 192.168.0.95, USB-C 192.168.42.95)
    variables:
      deviceIp:
        default: 192.168.0.95
        description: The IP address of the attenuator device on the local network
tags:
  - name: System
    description: Device status and reboot
  - name: Network
    description: Ethernet and USB-C interface configuration
  - name: Firmware
    description: Firmware status and dual-slot (A/B) updates
  - name: Attenuator
    description: Attenuation setpoint control
paths:
  /api/system/status:
    get:
      operationId: getSystemStatus
      tags: [System]
      summary: Get complete system status
      description: Returns complete system status information including device name, model, serial, connection status, and temperature.
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
  /api/system/reboot:
    post:
      operationId: rebootSystem
      tags: [System]
      summary: Reboot the device
      description: Reboots the device. The device will be unreachable for approximately 30 seconds.
      responses:
        '200':
          description: Reboot acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
  /api/network/config:
    get:
      operationId: getNetworkConfig
      tags: [Network]
      summary: Get network configuration
      description: Returns network configuration for both the Ethernet and USB-C interfaces, including configured settings and live interface information.
      responses:
        '200':
          description: Network configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkConfig'
    post:
      operationId: setNetworkConfig
      tags: [Network]
      summary: Update network configuration
      description: Updates network configuration and applies it immediately. Ethernet, USB-C, or both interfaces may be updated in a single request; only include fields to change. Changing network settings while connected may result in loss of connectivity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkConfig'
      responses:
        '200':
          description: Configuration applied
        '400':
          description: Bad Request — invalid input or parameters
  /api/network/reset:
    post:
      operationId: resetNetworkConfig
      tags: [Network]
      summary: Reset network configuration to factory defaults
      responses:
        '200':
          description: Network reset
  /api/firmware/status:
    get:
      operationId: getFirmwareStatus
      tags: [Firmware]
      summary: Get firmware status
      description: Returns current firmware version, dual-slot (A/B) information, and update progress.
      responses:
        '200':
          description: Firmware status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmwareStatus'
  /api/firmware/update:
    post:
      operationId: updateFirmware
      tags: [Firmware]
      summary: Upload and install a firmware bundle
      description: Upload a .raucb firmware bundle (max 256 MiB) for installation. Uses multipart/form-data. The mode query parameter is empty (default) for single slot or "full" for both slots. Installation runs asynchronously; poll GET /api/firmware/status for progress.
      parameters:
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: ['', full]
          description: Empty (default) for single slot, "full" for both slots
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firmware:
                  type: string
                  format: binary
                  description: The .raucb file (max 256 MiB)
      responses:
        '202':
          description: Accepted — installation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
  /api/firmware/update/url:
    post:
      operationId: updateFirmwareFromUrl
      tags: [Firmware]
      summary: Install firmware from a URL
      responses:
        '202':
          description: Accepted — installation started
  /api/firmware/update/resume:
    post:
      operationId: resumeFirmwareUpdate
      tags: [Firmware]
      summary: Resume a firmware update
      responses:
        '200':
          description: Update resumed
  /api/firmware/update/cancel:
    post:
      operationId: cancelFirmwareUpdate
      tags: [Firmware]
      summary: Cancel a firmware update
      responses:
        '200':
          description: Update cancelled
  /api/attenuator:
    get:
      operationId: getAttenuation
      tags: [Attenuator]
      summary: Get current attenuation setpoint
      description: Returns the current attenuation setpoint in dB.
      responses:
        '200':
          description: Current setpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attenuation'
    post:
      operationId: setAttenuation
      tags: [Attenuator]
      summary: Set attenuation setpoint
      description: Sets the attenuation setpoint in dB. Valid range 0 to 95.25 dB in steps of 0.25 dB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Attenuation'
      responses:
        '200':
          description: Setpoint applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attenuation'
        '400':
          description: Invalid request body
        '500':
          description: Failed to set setpoint (value out of range or invalid step size)
  /api/attenuator/startup:
    get:
      operationId: getStartupAttenuation
      tags: [Attenuator]
      summary: Get startup attenuation setpoint
      description: Returns the startup attenuation setpoint — the value applied when the device boots.
      responses:
        '200':
          description: Startup setpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartupAttenuation'
    post:
      operationId: setStartupAttenuation
      tags: [Attenuator]
      summary: Set startup attenuation setpoint
      description: Sets the startup attenuation setpoint. Persisted and applied on every device boot. Valid range 0 to 95.25 dB in steps of 0.25 dB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartupAttenuation'
      responses:
        '200':
          description: Startup setpoint saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartupAttenuation'
        '400':
          description: Invalid request body
        '500':
          description: Failed to save startup setpoint
components:
  schemas:
    SystemStatus:
      type: object
      properties:
        device: { type: string, description: Device name }
        hostname: { type: string, description: System hostname }
        model: { type: string, description: Device model identifier }
        serial: { type: string, description: Serial number }
        status: { type: string, description: 'Connection status: Connected via eth, Connected via usb, or Disconnected' }
        temperature: { type: number, description: Device temperature in °C }
        connectedIface: { type: string, description: 'Network interface the client is connected through (eth0 or usb0)' }
    StatusMessage:
      type: object
      properties:
        status: { type: string }
        message: { type: string }
    NetworkConfig:
      type: object
      properties:
        ethernet:
          $ref: '#/components/schemas/EthernetConfig'
        usb_gadget:
          $ref: '#/components/schemas/UsbGadgetConfig'
    EthernetConfig:
      type: object
      properties:
        mode: { type: string, enum: [dhcp_client_fallback, static, dhcp_client], description: 'dhcp_client_fallback is factory default' }
        ip_address: { type: string }
        netmask: { type: string }
        gateway: { type: string }
        dhcp_fallback_timeout: { type: integer }
        dhcp_server: { $ref: '#/components/schemas/DhcpServer' }
        live_ip: { type: string, readOnly: true }
        mac: { type: string, readOnly: true }
    UsbGadgetConfig:
      type: object
      properties:
        mode: { type: string, enum: [dhcp_host, static, disabled], description: 'dhcp_host is factory default' }
        ip_address: { type: string }
        netmask: { type: string }
        enabled: { type: boolean }
        dhcp_server: { $ref: '#/components/schemas/DhcpServer' }
        live_ip: { type: string, readOnly: true }
        mac: { type: string, readOnly: true }
    DhcpServer:
      type: object
      properties:
        range_start: { type: string }
        range_end: { type: string }
        lease_time: { type: string }
    FirmwareStatus:
      type: object
      properties:
        version: { type: string, description: Currently running firmware version }
        activeSlot: { type: string, enum: [A, B], description: Active firmware slot }
        inactiveSlot: { type: string, enum: [A, B] }
        inactiveVersion: { type: string }
        updateInProgress: { type: boolean }
        updateProgress: { type: number, description: Progress percentage 0-100, present during updates }
        updateMessage: { type: string }
        updateMode: { type: string, description: 'Empty for single-slot, "full" for both-slots updates' }
        updatePhase: { type: string, enum: [installing_first, rebooting, installing_second], description: Current phase during a full update }
        lastError: { type: string }
    Attenuation:
      type: object
      required: [setpoint]
      properties:
        setpoint:
          type: number
          minimum: 0
          maximum: 95.25
          multipleOf: 0.25
          description: Attenuation setpoint in dB (0 to 95.25 in steps of 0.25)
    StartupAttenuation:
      type: object
      required: [startup_setpoint]
      properties:
        startup_setpoint:
          type: number
          minimum: 0
          maximum: 95.25
          multipleOf: 0.25
          description: Startup attenuation setpoint in dB, persisted across boots
