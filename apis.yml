aid: nine-fives
name: Nine Fives
description: >-
  Nine Fives builds modern, simple-to-use RF (radio frequency) test equipment for
  next-generation spacecraft, drones, and cellphones. Founded in 2025 by Andrew
  Kurtz and Noah Levy — RF hardware engineers who spent a decade at SpaceX
  designing radios and test systems for Falcon 9, Dragon, and Starship — the
  Y Combinator-backed company sells programmable, network-connected instruments:
  the POE-ATTEN-6G programmable attenuator and the POE-SWITCH-6G programmable SPDT
  switch, powered over USB-C or Power over Ethernet. Each instrument is
  automation-first: it serves a JSON REST API and a SCPI command interface (raw TCP
  and HiSLIP/IVI-6.1) directly on the device, plus a browser Web UI and touchscreen,
  with no drivers to install — control it with a plain curl command. The NineVue
  platform adds version-controlled test-rack configuration and an LLM skill that
  turns a rack drawing into functional test-automation code.
